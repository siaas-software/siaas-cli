name: Publish verified SIAAS CLI v0.2.1

on:
  push:
    branches: [release/0.2.1-assets]
    paths: ['.github/workflows/v021-publication.yml']

permissions:
  actions: read
  contents: write

concurrency:
  group: siaas-cli-v021-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'siaas-software/siaas-cli' && github.event.repository.private == false && github.ref == 'refs/heads/release/0.2.1-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: siaas-software/siaas-cli
      SOURCE_COMMIT: c1c5e3ec0d6bbfd86b06f388e1204d231866fdc5
      ARTIFACT_ID: '14926467247'
      ARTIFACT_SHA: 7c8684cdc24bc0ee4534b17850080b3d30ae8f6c47e723903e7165437d19e48d
      TAG: v0.2.1
    steps:
      - name: Confirm accepted source, artifact provenance and absence of existing release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$SOURCE_COMMIT"
          gh api repos/$GH_REPO/actions/runs/45403602878 --jq '.conclusion' | grep -x success
          gh api repos/$GH_REPO/actions/runs/45406881274 --jq '.conclusion' | grep -x success
          gh api repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID > artifact.json
          python3 - <<'PY'
          import json,os
          a=json.load(open("artifact.json"))
          assert a["id"]==int(os.environ["ARTIFACT_ID"])
          assert a["name"]=="siaas-cli-v0.2.1-verified-assets" and not a["expired"]
          assert a["digest"]=="sha256:"+os.environ["ARTIFACT_SHA"]
          assert a["workflow_run"]["id"]==45406881274
          PY
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > releases.txt
          if grep -Fxq "$TAG" releases.txt; then echo "Existing release; refuse modification"; exit 1; fi
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq '.[].ref' > tags.txt
          if grep -Fxq "refs/tags/$TAG" tags.txt; then echo "Existing tag; refuse modification"; exit 1; fi
      - name: Retrieve exact artifact and verify every byte
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
          printf '%s  candidate.zip\n' "$ARTIFACT_SHA" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          expected={"cli-release-v1.txt","GO-LICENSE.txt","install.ps1","install.sh","RELEASE_NOTES.md","SHA256SUMS"}
          targets={(o,a) for o in ("linux","darwin","windows") for a in ("amd64","arm64")}
          expected|={f"siaas-cli_0.2.1_{o}_{a}"+(".exe" if o=="windows" else "") for o,a in targets}
          root=pathlib.Path("candidate");root.mkdir()
          with zipfile.ZipFile("candidate.zip") as z:
              assert len(z.infolist())==12 and set(z.namelist())==expected
              for name in expected: (root/name).write_bytes(z.read(name))
          sums=(root/"SHA256SUMS").read_text().splitlines()
          assert len(sums)==11 and {line.split("  ",1)[1] for line in sums}==expected-{"SHA256SUMS"}
          for line in sums:
              digest,name=line.split("  ",1)
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          lines=(root/"cli-release-v1.txt").read_text().splitlines()
          assert lines[0]=="siaas-cli-release-v1 0.2.1" and len(lines)==7
          seen=set()
          for line in lines[1:]:
              o,a,name,digest,size=line.split()
              assert (o,a) in targets and (o,a) not in seen
              assert name==f"siaas-cli_0.2.1_{o}_{a}"+(".exe" if o=="windows" else "")
              seen.add((o,a))
              b=(root/name).read_bytes()
              assert len(b)==int(size) and hashlib.sha256(b).hexdigest()==digest
          print("All 12 verified assets match the accepted artifact.")
          PY
      - name: Create draft and upload verified assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$SOURCE_COMMIT"
          gh release create "$TAG" --repo "$GH_REPO" --target "$SOURCE_COMMIT" --draft --title "SIAAS CLI v0.2.1" --notes-file candidate/RELEASE_NOTES.md
          gh release upload "$TAG" candidate/* --repo "$GH_REPO"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="v0.2.1")' > draft.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          d=json.load(open("draft.json"))
          assert d["draft"] and not d["prerelease"] and d["tag_name"]==os.environ["TAG"]
          assert d["target_commitish"]==os.environ["SOURCE_COMMIT"]
          root=pathlib.Path("candidate")
          assert len(d["assets"])==12 and {a["name"] for a in d["assets"]}=={p.name for p in root.iterdir()}
          for a in d["assets"]:
              b=(root/a["name"]).read_bytes()
              assert a["state"]=="uploaded" and a["size"]==len(b)
              assert a["digest"]=="sha256:"+hashlib.sha256(b).hexdigest()
          print("Draft release verified: 12 uploaded assets with matching digests.")
          PY
      - name: Publish stable Latest release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease=false --latest
          test "$(gh api repos/$GH_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$SOURCE_COMMIT"
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = "$TAG"
      - name: Verify anonymous public downloads and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          mkdir public
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          for file in candidate/*; do
            name=${file##*/}
            curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' "$base/$name" -o "public/$name"
            cmp "$file" "public/$name"
          done
          (cd public && sha256sum -c SHA256SUMS)
          chmod +x public/siaas-cli_0.2.1_linux_amd64
          test "$(public/siaas-cli_0.2.1_linux_amd64 --version)" = 'siaas 0.2.1'
          home=$(mktemp -d)
          HOME="$home" bash public/install.sh
          test "$("$home/.local/bin/siaas" --version)" = 'siaas 0.2.1'
          echo 'PUBLISHED AND VERIFIED: 12 anonymous downloads and Linux bootstrap passed.'
