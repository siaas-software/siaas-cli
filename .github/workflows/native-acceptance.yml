name: M1 native acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.repository == 'siaas-software/siaas-cli' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTELEMETRY: 'off'
      GOENV: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          cache: false
          check-latest: false
      - name: Linux preflight
        run: |
          set -euo pipefail
          go version
          unformatted=$(gofmt -l cmd internal tools tests)
          if test -n "$unformatted"; then
            gofmt -d cmd internal tools tests
            exit 1
          fi
          go vet ./...
          bash -n install.sh tests/rc4-rc5-profile.sh tests/public-rc4-rc5-lifecycle.sh
          go test -count=1 -timeout=8m ./...
          go test -race -count=1 -timeout=8m ./...
          go build ./cmd/siaas
      - name: Provision official pinned Node runtime
        if: startsWith(github.head_ref, 'release/0.2.') || startsWith(github.ref, 'refs/heads/release/0.2.')
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          cd "$root"
          base=https://nodejs.org/dist/v24.22.0
          name=node-v24.22.0-linux-x64.tar.gz
          curl --fail --silent --show-error --proto '=https' "$base/SHASUMS256.txt" -o SHASUMS256.txt
          curl --fail --silent --show-error --proto '=https' "$base/$name" -o "$name"
          grep -E "^[a-f0-9]{64}  $name$" SHASUMS256.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check selected.sha256
          tar -xzf "$name"
          echo "$root/node-v24.22.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: RC4 to RC5 copied-profile migration fixture
        if: startsWith(github.head_ref, 'release/0.2.') || startsWith(github.ref, 'refs/heads/release/0.2.')
        run: bash tests/rc4-rc5-profile.sh

      - name: Public compiled CLI lifecycle
        if: startsWith(github.head_ref, 'release/0.2.') || startsWith(github.ref, 'refs/heads/release/0.2.')
        run: bash tests/public-rc4-rc5-lifecycle.sh

  native:
    needs: preflight
    # Never allocate runners for a private copy or another repository.
    if: github.repository == 'siaas-software/siaas-cli' && github.event.repository.private == false
    name: ${{ matrix.runner }} (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            setup_arch: x64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            setup_arch: arm64
          - runner: windows-2022
            goos: windows
            goarch: amd64
            setup_arch: x64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            setup_arch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            setup_arch: x64
          - runner: macos-15
            goos: darwin
            goarch: arm64
            setup_arch: arm64
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTELEMETRY: 'off'
      GOENV: 'off'
      SIAAS_EXPECTED_OS: ${{ matrix.goos }}
      SIAAS_EXPECTED_ARCH: ${{ matrix.goarch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned native Go compiler
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          architecture: ${{ matrix.setup_arch }}
          cache: false
          check-latest: false
      - name: Verify native toolchain and formatting
        run: |
          go version
          actual_os=$(go env GOHOSTOS | tr -d '\r')
          actual_arch=$(go env GOHOSTARCH | tr -d '\r')
          printf 'Native compiler host: %s/%s; expected: %s/%s\n' "$actual_os" "$actual_arch" "$SIAAS_EXPECTED_OS" "$SIAAS_EXPECTED_ARCH"
          test "$actual_os" = "$SIAAS_EXPECTED_OS"
          test "$actual_arch" = "$SIAAS_EXPECTED_ARCH"
          unformatted=$(gofmt -l cmd internal tools tests)
          if test -n "$unformatted"; then
            printf 'Go files requiring formatting:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
      - name: Unix host and Bash syntax
        if: runner.os != 'Windows'
        run: |
          uname -srmp
          bash --version
          bash -n install.sh
      - name: Windows PowerShell 5.1 and URI policy
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable | Format-List
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1 -or $PSVersionTable.PSEdition -ne 'Desktop') { throw 'Windows PowerShell 5.1 Desktop is required.' }
          [Environment]::OSVersion.VersionString
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          & ./tests/powershell-policy.ps1
      - name: Native CLI and offline bootstrap acceptance
        run: go test -v -count=1 -timeout=8m ./...
      - name: Windows interactive shell and user PATH regression (both PowerShell editions)
        if: runner.os == 'Windows' && (github.head_ref == 'release/0.2.1' || github.ref == 'refs/heads/release/0.2.1')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($shell in @('powershell.exe','pwsh.exe')) {
            $saved = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $output = & $shell -NoProfile -NonInteractive -File tests/windows-path-and-session.ps1 2>&1
            $code = $LASTEXITCODE
            $ErrorActionPreference = $saved
            $output | Write-Output
            if ($code -ne 0 -or ($output | Out-String) -notmatch 'SESSION_PATH_ACCEPTANCE=PASS') { throw "Session/PATH regression failed for $shell." }
          }
      - name: Windows unsigned distribution policy probes
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-os-security.ps1
      - name: Windows genuine standard-user acceptance
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-standard-user.ps1
      - name: macOS unsigned distribution policy probes
        if: runner.os == 'macOS'
        run: bash tests/macos-os-security.sh
