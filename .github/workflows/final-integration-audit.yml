name: Isolated final integration audit
on:
  push:
    branches: [audit/v0.1.0-final-integration]
permissions:
  contents: read
concurrency:
  group: final-integration-audit
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'siaas-software/siaas-cli' && github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            goarch: amd64
          - runner: windows-11-arm
            arch: arm64
            goarch: arm64
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTELEMETRY: 'off'
      GOENV: 'off'
      SIAAS_EXPECTED_OS: windows
      SIAAS_EXPECTED_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          architecture: ${{ matrix.arch }}
          cache: false
      - name: Prove release implementation unchanged
        shell: bash
        run: |
          git diff --exit-code 5fbc8abb1c1d07b5f1db92559fb13d6796d4e35d HEAD -- cmd internal tools install.sh install.ps1 go.mod .go-version tests/windows-standard-user.ps1
          test -z "$(gofmt -l tests/website_pipeline_windows_test.go)"
          go vet ./...
      - name: Native PowerShell HTTP pipeline fixtures
        shell: bash
        run: go test -v -count=1 -timeout=8m ./tests -run '^TestWebsitePowerShellPipeline$'
      - name: Genuine standard-user integration and HTTP pipeline
        shell: powershell
        run: ./tests/windows-standard-user.ps1
